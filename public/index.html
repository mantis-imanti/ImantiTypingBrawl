<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMANTI Typing Brawl</title>
    <link rel="icon" href="/favicon.ico?v=999">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="popup">

        <div id="popupContent">

            <h1>IMANTI Typing Brawl</h1>

            <input type="text" id="nameInput" maxlength="26" placeholder="Nombre del jugador">

            <input type="password" id="passwordInput">

            <button id="joinBtn">Entrar</button>

        </div>

    </div>

    <div id="game">

        <div id="masterPanel" style="display:none;">

            <textarea id="customText" placeholder="Escribe el texto de la carrera"></textarea>

            <button id="startBtn">
                INICIAR JUEGO
            </button>

        </div>

        <div id="topBar">

            <div id="countdown">
                Esperando a que todos se unan...
            </div>

            <div id="stats">

                <span id="wpm">0 PPM</span>
                <span id="accuracy">100%</span>
                <span id="errors">0 errores</span>

            </div>

        </div>

        <div id="textContainer">

            <div id="caret"></div>

            <div id="text"></div>

        </div>

        <input type="text" id="hiddenInput" autocomplete="off">

        <div id="winner"></div>

        <div id="players"></div>
        <button id="nextRoundBtn" style="display:none; width:100%; margin-top:20px;">
            SIGUIENTE RONDA
        </button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>

</body>
</html>
